name: Validar Radar Laboral
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa-basico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript y controles
        run: node scripts/verify.mjs

      - name: Validar publicaciones en español
        run: node scripts/test-language.mjs
      - name: Verificar fuentes y diagnósticos por portal
        run: node scripts/test-sources.mjs
      - name: Validar interfaz Radar 2.0 y seguridad Auto Apply
        run: node scripts/test-workspace.mjs
      - name: Validar asesor personal y preferencias laborales
        run: node scripts/test-career-assistant.mjs
      - name: Comprobar API Himalayas en vivo
        run: node scripts/smoke-himalayas.mjs
